name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [validate, test]
    env:
      COMMITLINT_FROM: ${{ github.event.pull_request.base.sha || (!github.event.forced && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'HEAD~1' }}
      COMMITLINT_TO: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v5.0.0
      - run: bun install --frozen-lockfile
      - name: Validate squash commit title
        if: github.event_name == 'pull_request' && matrix.check == 'validate'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s (#%s)\n' "$PR_TITLE" "$PR_NUMBER" | bun run --bun commitlint --strict
      - run: bun --env-file=.env.test run ${{ matrix.check }}

  deploy:
    name: Deploy production
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.0.0
      - name: Deploy checked commit to Vercel
        run: bunx --bun vercel@60.1.3 deploy --prod --yes --token "$VERCEL_TOKEN"
