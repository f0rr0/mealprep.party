[tools]
bun = "1.4.2"
hk = "2.4.0"

[env]
_.path = ["node_modules/.bin"]

[tasks.setup]
description = "Install dependencies and repository hooks"
run = ["bun install --frozen-lockfile", "hk install --mise"]

[tasks.lint]
run = "bun run lint"

[tasks.test]
run = "bun test"

[tasks.format]
run = "bun run format"

[tasks.knip]
run = "bun run knip"

[tasks.check]
run = "hk check --all"

[tasks.fix]
run = "hk fix --all"

[tasks.commit]
run = "bun run commit"
